<!doctype html><meta charset="utf-8"><title>Lolite Pack — Breakout</title><style>body{margin:0;background:#090613;color:#fff;font:16px system-ui;text-align:center}canvas{background:#0d0a18;border:1px solid #30274d;border-radius:14px;max-width:92vw}</style><h2>🧱 Breakout</h2><p>Move with mouse or ← → · Break every brick</p><canvas width="600" height="420"></canvas><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let p=250,b={x:300,y:350,vx:4,vy:-4,r:7},br=[];for(let r=0;r<5;r++)for(let q=0;q<10;q++)br.push({x:12+q*59,y:35+r*25,on:1});addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();p=Math.max(0,Math.min(500,e.clientX-r.left-50))});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')p=Math.max(0,p-25);if(e.key==='ArrowRight')p=Math.min(500,p+25)});function loop(){x.clearRect(0,0,600,420);x.fillStyle='#8b5cf6';x.fillRect(p,390,100,12);x.fillStyle='#3b82f6';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();br.forEach((q,i)=>{if(!q.on)return;x.fillStyle=['#8b5cf6','#3b82f6','#06b6d4','#22c55e','#ec4899'][i%5];x.fillRect(q.x,q.y,52,18);if(b.x>q.x&&b.x<q.x+52&&b.y>q.y&&b.y<q.y+18){q.on=0;b.vy*=-1}});b.x+=b.vx;b.y+=b.vy;if(b.x<7||b.x>593)b.vx*=-1;if(b.y<7)b.vy*=-1;if(b.y>382&&b.x>p&&b.x<p+100)b.vy=-Math.abs(b.vy);if(b.y>430){alert('Game over');location.reload()}if(br.every(q=>!q.on)){alert('You win!');location.reload()}requestAnimationFrame(loop)}loop()</script>
