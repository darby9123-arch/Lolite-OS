name: Deploy Lolite OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # GitHub Pages rejects overlapping deployments even after previous runs are cancelled.
  # Queue commits instead of leaving a half-cancelled Pages deployment in progress.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp exact GitHub Pages source commit
        run: |
          printf '{"ok":true,"service":"lolite-os","version":"4.0.0","provider":"github-pages","commit":"%s"}\n' "$GITHUB_SHA" > core/lolite-build.json

      - name: Upload site
        id: site_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      # Newly uploaded artifacts can briefly be absent from the REST listing.
      # Attempt-specific names also keep retries from matching older uploads.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          LOLITE_PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for lookup_attempt in {1..12}; do
            pages_artifact_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$LOLITE_PAGES_ARTIFACT" --jq '.artifacts | length')"
            if [ "$pages_artifact_count" = "1" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Pages artifact metadata did not become available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          LOLITE_PAGES_ARTIFACT_ID: ${{ steps.site_artifact.outputs.artifact_id }}
        with:
          script: |
            // Use the uploader's exact ID. The legacy action reads a separate,
            // eventually consistent artifact listing which can omit this upload.
            const artifactId = Number(process.env.LOLITE_PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The Pages upload did not return a valid artifact ID.');
            }
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifactId,
              pages_build_version: context.sha, oidc_token: idToken
            });
            core.setOutput('page_url', deployment.page_url);
            const failed = new Set(['deployment_failed', 'deployment_perms_error',
              'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let poll = 0; poll < 120; poll++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                ...context.repo, deploymentId: deployment.id
              });
              if (data.status === 'succeed') {
                core.info('GitHub Pages publication completed.');
                return;
              }
              if (failed.has(data.status)) throw new Error('Pages publication failed: ' + data.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
              ...context.repo, deploymentId: deployment.id
            });
            throw new Error('Pages publication exceeded its ten-minute time limit.');
