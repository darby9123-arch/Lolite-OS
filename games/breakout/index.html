<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lolite Breakout</title><style>body{margin:0;background:#090613;color:#fff;font:14px system-ui;text-align:center}canvas{max-width:94vw;background:#05040a;border:1px solid #39265f;border-radius:14px}button{margin:10px;padding:9px 15px;border:0;border-radius:10px;background:#3b82f6;color:#fff;font-weight:700}</style></head><body><h1>🧱 Lolite Breakout</h1><div id=s>Score: 0 · Lives: 3</div><canvas id=c width=640 height=420></canvas><br><button onclick=start()>New Game</button><p>Move with ← → or mouse</p><script>const x=c.getContext('2d');let p,b,r,score,lives,t;function start(){p=270;b={x:315,y:350,vx:4,vy:-4};score=0;lives=3;r=Array.from({length:5},(_,j)=>Array.from({length:10},(_,i)=>({x:15+i*62,y:25+j*25,on:1})));clearInterval(t);t=setInterval(loop,16)}onkeydown=e=>{if(e.key==='ArrowLeft')p-=28;if(e.key==='ArrowRight')p+=28;p=Math.max(0,Math.min(540,p))};c.onmousemove=e=>{let z=c.getBoundingClientRect();p=(e.clientX-z.left)/z.width*640-50;p=Math.max(0,Math.min(540,p))};function loop(){b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>630)b.vx*=-1;if(b.y<0)b.vy*=-1;if(b.y>385&&b.x>p-5&&b.x<p+105)b.vy=-Math.abs(b.vy);for(let row of r)for(let a of row)if(a.on&&b.x>a.x&&b.x<a.x+58&&b.y>a.y&&b.y<a.y+20){a.on=0;b.vy*=-1;score++}if(b.y>430){lives--;b={x:315,y:350,vx:4,vy:-4};if(lives<=0)start()}draw()}function draw(){x.clearRect(0,0,640,420);r.flat().forEach(a=>{if(a.on){x.fillStyle='#8b5cf6';x.fillRect(a.x,a.y,58,20)}});x.fillStyle='#fff';x.fillRect(p,390,100,10);x.beginPath();x.arc(b.x,b.y,7,0,7);x.fill();s.textContent='Score: '+score+' · Lives: '+lives}start()</script></body></html>
