<!doctype html><html lang="en"><meta charset="utf-8"><title>Lolite Chat isolated browser check</title>
<style>body{margin:0;background:#101623;color:white;font:14px system-ui}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button{padding:9px 14px;border-radius:7px;border:1px solid #678;background:#293c57;color:white;cursor:pointer}#frames{display:flex;gap:10px;overflow:auto;padding:10px}iframe{border:1px solid #45576d;width:900px;min-width:900px;height:700px;border-radius:10px}output{white-space:pre-wrap}#results{padding:10px}#errors{color:#ffadaf}</style>
<header><strong>Isolated chat check · fictional users · synthetic audio</strong><button id="call">Alex calls Sam</button><button id="refresh">Refresh both chats</button><button id="narrow">Narrow / desktop</button><button id="end">End calls</button></header><div id="results"><output id="state">Starting…</output><div id="errors"></div></div><div id="frames"><iframe title="Alex chat" src="browser-peer.html?user=a"></iframe><iframe title="Sam chat" src="browser-peer.html?user=b"></iframe></div>
<script>
const channels=new Set(),rows={profiles:[{id:'a',username:'alex',display_name:'Alex',avatar:'AL',about:'Local test user',status:'online'},{id:'b',username:'sam',display_name:'Sam',avatar:'SA',status:'online'}],conversations:[{id:'room',type:'dm',created_at:'2026-01-01'},{id:'group',type:'group',name:'Weekend games',created_at:'2026-01-01'}],conversation_members:[{conversation_id:'room',user_id:'a'},{conversation_id:'room',user_id:'b'},{conversation_id:'group',user_id:'a'},{conversation_id:'group',user_id:'b'}],friend_requests:[{id:'friend',from_id:'a',to_id:'b',status:'accepted'}],messages:[{id:1,conversation_id:'room',sender_id:'b',content:'Hey! Want to play something later?',created_at:'2026-11-13T00:00:00Z'},{id:2,conversation_id:'room',sender_id:'a',content:'Yeah, give me five minutes.',created_at:'2026-11-13T00:01:00Z'},{id:3,conversation_id:'room',sender_id:'b',content:'Sure. We can call here too.',created_at:'2026-11-13T00:02:00Z'}],blocks:[],lolite_admins:[],message_reactions:[],message_reads:[],chat_calls:[],chat_call_invites:[]};
let nextId=100;
function emitChanges(table){queueMicrotask(()=>{for(const c of channels)for(const h of c.handlers)if(h.type==='postgres_changes'&&h.filter.table===table)h.fn({})})}
class Query{
 constructor(table){this.table=table;this.filters=[];this.action='select'}select(){return this}order(key,options={}){this.sort={key,ascending:options.ascending!==false};return this}limit(){return this}eq(k,v){this.filters.push(r=>r[k]===v);return this}in(k,v){this.filters.push(r=>v.includes(r[k]));return this}gt(k,v){this.filters.push(r=>r[k]>v);return this}match(o){for(const[k,v]of Object.entries(o))this.eq(k,v);return this}insert(value){this.action='insert';this.value=value;return this}update(value){this.action='update';this.value=value;return this}delete(){this.action='delete';return this}upsert(value){return this.insert(value)}single(){this.one=true;return this}maybeSingle(){this.one=true;return this}
 then(ok,bad){return Promise.resolve().then(()=>{const all=rows[this.table]||[],selected=all.filter(r=>this.filters.every(f=>f(r)));let data=selected;if(this.sort)data.sort((a,b)=>String(a[this.sort.key]).localeCompare(String(b[this.sort.key]))*(this.sort.ascending?1:-1));if(this.action==='insert'){data=(Array.isArray(this.value)?this.value:[this.value]).map(r=>({id:nextId++,created_at:new Date().toISOString(),expires_at:new Date(Date.now()+60000).toISOString(),status:'ringing',...r}));all.push(...data)}else if(this.action==='update')selected.forEach(r=>Object.assign(r,this.value));else if(this.action==='delete')rows[this.table]=all.filter(r=>!selected.includes(r));if(this.action!=='select')emitChanges(this.table);return {data:structuredClone(this.one?data[0]||null:data),error:null}}).then(ok,bad)}
}
function sync(topic){queueMicrotask(()=>{for(const c of channels)if(c.name===topic)for(const h of c.handlers)if(h.type==='presence')h.fn({})})}
window.testClient=user=>({auth:{getUser:async()=>({data:{user:{id:user}}}),onAuthStateChange(){}},from:t=>new Query(t),channel(name,options){const c={name,options,handlers:[],user,on(type,filter,fn){this.handlers.push({type,filter,fn});return this},subscribe(fn){channels.add(this);queueMicrotask(()=>fn?.('SUBSCRIBED'));return this},async track(){this.tracked=true;sync(name);return 'ok'},presenceState(){const state={};for(const other of channels)if(other.name===name&&other.tracked)(state[other.user]??=[]).push({user_id:other.user});return state},async send(message){queueMicrotask(()=>{for(const other of channels)if(other!==this&&other.name===name)for(const h of other.handlers)if(h.type===message.type&&h.filter.event===message.event)h.fn({payload:JSON.parse(JSON.stringify(message.payload))})});return 'ok'}};return c},async removeChannel(c){channels.delete(c);sync(c.name)}});
const peers=()=>[...document.querySelectorAll('iframe')].map(f=>f.contentWindow);
document.querySelector('#call').onclick=()=>peers()[0].LoliteChatCalls.startCall('room');
document.querySelector('#refresh').onclick=()=>peers().forEach(w=>w.LoliteChat.refresh());
document.querySelector('#end').onclick=()=>peers().forEach(w=>w.LoliteChatCalls.hangup());
let narrow=false;document.querySelector('#narrow').onclick=()=>{narrow=!narrow;for(const f of document.querySelectorAll('iframe'))f.style.width=f.style.minWidth=narrow?'350px':'900px'};
setInterval(()=>{document.querySelector('#state').textContent=peers().map((w,i)=>{const s=w.LoliteChatExtra?.connectionState(),live=w.testStreams?.filter(x=>x.getTracks().some(t=>t.readyState==='live')).length;return ['Alex','Sam'][i]+': '+JSON.stringify(s||{})+' · active microphone streams: '+(live||0)+' · transport: '+(w.testPeers||[]).map(p=>[p.signalingState,p.iceConnectionState,p.iceGatheringState,p.localDescription?.type,p.remoteDescription?.type].join('/')).join(', ')}).join('\n')},500);
</script></html>
