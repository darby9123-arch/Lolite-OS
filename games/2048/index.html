<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lolite 2048</title><style>body{margin:0;background:#090613;color:#fff;font:14px system-ui;text-align:center}.grid{width:min(88vw,420px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#19142d;padding:8px;border-radius:16px}.tile{display:grid;place-items:center;background:#30274d;border-radius:10px;font-size:26px;font-weight:800}.hot{background:#8b5cf6}button{margin:12px;padding:9px 15px;border:0;border-radius:10px;background:#8b5cf6;color:#fff;font-weight:700}</style></head><body><h1>🔢 Lolite 2048</h1><div id=s>Score: 0</div><div id=g class=grid></div><button onclick=start()>New Game</button><p>Arrow keys or WASD</p><script>let a,sc;function start(){a=Array(16).fill(0);sc=0;add();add();draw()}function add(){let e=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)a[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}onkeydown=e=>{let k={ArrowLeft:0,a:0,ArrowUp:1,w:1,ArrowRight:2,d:2,ArrowDown:3,s:3}[e.key];if(k===undefined)return;move(k)};function move(dir){let old=a.join(),lines=[];for(let i=0;i<4;i++){let l=dir===0?a.slice(i*4,i*4+4):dir===2?a.slice(i*4,i*4+4).reverse():dir===1?[a[i],a[i+4],a[i+8],a[i+12]]:[a[i+12],a[i+8],a[i+4],a[i]];l=l.filter(Boolean);for(let j=0;j<l.length-1;j++)if(l[j]===l[j+1]){l[j]*=2;sc+=l[j];l.splice(j+1,1)}while(l.length<4)l.push(0);lines.push(l)}for(let i=0;i<4;i++){let l=lines[i];if(dir===0||dir===2){if(dir===2)l=l.reverse();for(let j=0;j<4;j++)a[i*4+j]=l[j]}else for(let j=0;j<4;j++)a[i+j*4]=dir===1?l[j]:l[3-j]}if(a.join()!==old)add();draw()}function draw(){g.innerHTML=a.map(v=>`<div class="tile ${v?'hot':''}">${v||''}</div>`).join('');s.textContent='Score: '+sc}start()</script></body></html>
