<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drift Hunters · Lolite OS</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080c14;color:#eef3fc;font:14px system-ui,Segoe UI,sans-serif}
body{display:flex;flex-direction:column}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:#131c2a;border-bottom:1px solid #2d3b52}.bar strong{margin-right:auto}button{border:1px solid #3b4b66;border-radius:8px;background:#21304a;color:#fff;padding:8px 12px;cursor:pointer}button:hover{background:#304465}button[aria-pressed=true]{border-color:#809dff;background:#354d88}.viewer{flex:1;min-height:0;position:relative}.viewer iframe{height:100%;width:100%;border:0;background:#000}.notice{padding:7px 12px;font-size:12px;color:#bec8d9;background:#101925}.notice a{color:#a9c9ff}@media(max-width:500px){.bar strong{width:100%}}
</style></head><body>
<div class="bar"><strong>Drift Hunters</strong><button id="serverA" type="button" aria-pressed="true">Server 1</button><button id="serverB" type="button" aria-pressed="false">Server 2</button><button id="full" type="button">Fullscreen</button><button id="reload" type="button">Reload</button></div>
<div class="viewer" id="viewer"><iframe id="game" title="Drift Hunters game" allow="fullscreen; autoplay; gamepad" allowfullscreen referrerpolicy="no-referrer"></iframe></div>
<div class="notice">Internet required. If a server won't load, try the other server. Some providers block embedding. <a id="direct" href="#" target="_blank" rel="noopener noreferrer">Open current server directly</a>.</div>
<script>
(()=>{
 const urls=[
 'https://v6p9d9t4.ssl.hwcdn.net/html/1792221/ItchIO/index.html',
 'https://zayaruzostreetorgan.com/uploads/5/5/6/7/5567194/custom_themes/136734914403232081/drift_hunter.html'
 ];
 let selected=0;
 const frame=document.getElementById('game'),link=document.getElementById('direct');
 function change(i){selected=i;frame.src=urls[i];link.href=urls[i];for(let n=0;n<2;n++)document.getElementById(n?'serverB':'serverA').setAttribute('aria-pressed',String(i===n));}
 document.getElementById('serverA').onclick=()=>change(0);
 document.getElementById('serverB').onclick=()=>change(1);
 document.getElementById('reload').onclick=()=>{frame.src=urls[selected]};
 document.getElementById('full').onclick=()=>{const v=document.getElementById('viewer');(v.requestFullscreen||v.webkitRequestFullscreen)?.call(v)};
 change(0);
})();
</script></body></html>
