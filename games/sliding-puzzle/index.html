<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lolite Sliding Puzzle</title><style>body{margin:0;background:#0b0716;color:#fff;font:14px system-ui;text-align:center}.b{display:grid;grid-template-columns:repeat(4,64px);gap:6px;width:max-content;margin:18px auto}.b button{height:64px;border:0;border-radius:10px;background:#6d4cc4;color:#fff;font-size:22px;font-weight:800}.b button:last-child{background:#171126}button{cursor:pointer}body>button{padding:8px 12px;border:0;border-radius:8px;background:#6d4cc4;color:#fff;font-weight:700}</style></head><body><h2>🧩 Lolite Sliding Puzzle</h2><p id="s">Arrange 1–15</p><div class="b" id="b"></div><button onclick="reset()">Shuffle</button><script>const box=document.getElementById('b'),s=document.getElementById('s');let a=[];function reset(){a=[...Array(15)].map((_,i)=>i+1).concat(0);for(let i=0;i<250;i++){let z=a.indexOf(0),x=z%4,y=z/4|0,ds=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>{let X=x+d[0],Y=y+d[1];return X>=0&&X<4&&Y>=0&&Y<4});let d=ds[Math.random()*ds.length|0],n=(y+d[1])*4+x+d[0];[a[z],a[n]]=[a[n],a[z]]}draw()}function draw(){box.innerHTML='';a.forEach((v,i)=>{let q=document.createElement('button');q.textContent=v||'';q.onclick=()=>move(i);box.append(q)});if(a.every((v,i)=>v===(i<15?i+1:0)))s.textContent='🎉 Solved!'}function move(i){let z=a.indexOf(0),x=i%4,y=i/4|0,zx=z%4,zy=z/4|0;if(Math.abs(x-zx)+Math.abs(y-zy)===1){[a[i],a[z]]=[a[z],a[i]];draw()}}reset()</script></body></html>
