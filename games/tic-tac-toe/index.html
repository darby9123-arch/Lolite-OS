<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic-tac-toe</title><style>body{margin:0;background:#0b0716;color:#eee;font:16px system-ui;text-align:center}h1{margin:16px}.board{display:grid;grid-template-columns:repeat(3,90px);gap:8px;justify-content:center}.cell{height:90px;border:1px solid #3b2a68;background:#17102e;color:#fff;font-size:42px;border-radius:12px}.cell:hover{background:#21163e}button.reset{margin:18px;padding:10px 16px;border:0;border-radius:10px;background:#6d42d8;color:white}.status{min-height:24px}</style></head><body><h1>Tic-tac-toe</h1><div class="status" id="status"></div><div class="board" id="board"></div><button class="reset" onclick="reset()">New game</button><script>let b=Array(9).fill(''),turn='X',over=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function render(){board.innerHTML=b.map((v,i)=>`<button class="cell" onclick="move(${i})">${v}</button>`).join('');status.textContent=over?'Game over':turn+'\'s turn'}function move(i){if(over||b[i])return;b[i]=turn;if(wins.some(w=>w.every(i=>b[i]===turn))){over=true;status.textContent=turn+' wins!'}else if(b.every(Boolean)){over=true;status.textContent='Draw!'}else turn=turn==='X'?'O':'X';render()}function reset(){b=Array(9).fill('');turn='X';over=false;render()}render()</script></body></html>
