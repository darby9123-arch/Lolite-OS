<!doctype html><meta charset="utf-8"><title>Lolite Pack — Snake</title><style>body{margin:0;background:#090613;color:#fff;font:16px system-ui;text-align:center}canvas{background:#111022;border:1px solid #30274d;border-radius:14px;max-width:92vw}button{background:#8b5cf6;color:white;border:0;border-radius:10px;padding:9px 14px;margin:8px;cursor:pointer}</style><h2>🐍 Snake</h2><p>Arrow keys / WASD · Eat the food · Don't hit yourself</p><canvas width="420" height="420"></canvas><br><button onclick="start()">Restart</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),n=21,s=20;let snake,food,dir,score,timer;function start(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food={x:15,y:10};dir={x:1,y:0};score=0;clearInterval(timer);timer=setInterval(loop,110)}function place(){do{food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}addEventListener('keydown',e=>{const k=e.key.toLowerCase(),d=k==='arrowup'||k==='w'?{x:0,y:-1}:k==='arrowdown'||k==='s'?{x:0,y:1}:k==='arrowleft'||k==='a'?{x:-1,y:0}:k==='arrowright'||k==='d'?{x:1,y:0}:null;if(d&&!(d.x===-dir.x&&d.y===-dir.y))dir=d});function loop(){const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);alert('Game over! Score: '+score);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;place()}else snake.pop();draw()}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#ec4899';x.fillRect(food.x*s,food.y*s,s-2,s-2);snake.forEach((p,i)=>{x.fillStyle=i?'#8b5cf6':'#3b82f6';x.fillRect(p.x*s,p.y*s,s-2,s-2)});x.fillStyle='#fff';x.fillText('Score: '+score,8,18)}start();</script>
