<!doctype html><meta charset=utf-8><title>Lolite Sokoban</title><style>body{margin:0;background:#090613;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.g{width:min(520px,94vw)}#b{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:#121022;padding:8px;border-radius:14px}.c{aspect-ratio:1;display:grid;place-items:center;border-radius:5px;font-size:20px}.w{background:#29213d}.f{background:#0d1728}.p{background:#5b36a5}.box{background:#a66b2c}.goal{background:#194e52}p{color:#aaa0bd}</style><div class=g><h1>Sokoban</h1><p>Arrow keys / WASD • R restart</p><div id=b></div></div><script>const level=['########',' #     #'.replace(' ', '#'),'#  .   #','#  $   #','#  @   #','#      #','########','########'];let map=level.map(r=>r.padEnd(8,'#').split(''));let start=JSON.stringify(map);function draw(){b.innerHTML=map.flatMap((r,y)=>r.map((v,x)=>{let cl=v==='#'?'w':v==='@'?'p':v==='$'?'box':v==='.'?'goal':'f';return`<div class=c style="grid-column:${x+1};grid-row:${y+1}">${v==='@'?'●':v==='$'?'■':v==='.'?'•':''}</div>`})).join('')}function pos(ch){for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(map[y][x]===ch)return[x,y];return[0,0]}function mv(dx,dy){let[pX,pY]=pos('@'),nx=pX+dx,ny=pY+dy;if(map[ny]?.[nx]==='#')return;if(map[ny]?.[nx]==='$'){let bx=nx+dx,by=ny+dy;if(map[by]?.[bx]==='#'||map[by]?.[bx]==='$')return;map[by][bx]='$'}map[pY][pX]=' ';map[ny][nx]='@';draw();if(map.flat().filter(x=>x==='$').length&&map.flat().filter(x=>x==='.').length&&map.flat().filter(x=>x==='$').every((_,i)=>true)){} }onkeydown=e=>{let k=e.key.toLowerCase();if(k==='r'){map=JSON.parse(start);draw()}else if(k==='w'||e.key==='ArrowUp')mv(0,-1);else if(k==='s'||e.key==='ArrowDown')mv(0,1);else if(k==='a'||e.key==='ArrowLeft')mv(-1,0);else if(k==='d'||e.key==='ArrowRight')mv(1,0)};draw()</script>
