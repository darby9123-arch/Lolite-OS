<title>Cosmos App Icons | Lolite OS</title>
<style>
:root{color-scheme:dark;font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#f0f8ff;min-height:100vh}
main{max-width:1100px;margin:auto;padding:36px 24px 70px}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{width:68px;height:68px;border-radius:18px}
h1{font-size:clamp(24px,4vw,36px);margin:0;font-weight:750;letter-spacing:-.04em}
.subtitle{margin:6px 0;color:#a4bbd6}
a{color:#b5e3ff}a:focus-visible,button:focus-visible{outline:2px solid #84c8ff;outline-offset:3px}
.back{display:inline-flex;margin:22px 0 28px;padding:9px 14px;border:1px solid #3b5975;border-radius:9px;background:#15253c;color:#e2f2ff;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}
.card{min-width:0;min-height:134px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:linear-gradient(140deg,#13253a,#0c192d);border:1px solid #304661;border-radius:15px;padding:17px 10px;text-align:center}
.card strong{font-size:12px;font-weight:650;line-height:1.3;color:#cfdeef;overflow-wrap:anywhere}
.lolite-icon{display:grid;place-items:center;width:67px;height:67px;border-radius:19px;flex:none;background:linear-gradient(145deg,var(--icon-from,#1b3554),var(--icon-to,#0c1729));border:1px solid #81b3d257;box-shadow:inset 0 1px #ffffff17,0 9px 20px #0006}
.lolite-icon svg{width:78%;height:78%}
.smallprint{margin:20px 0 0;color:#8eacc8;font-size:12px}
@media(max-width:500px){main{padding:22px 14px 44px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{padding:12px 5px;min-height:118px}.lolite-icon{width:58px;height:58px}}
