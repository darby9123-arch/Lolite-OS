<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lolite Connect Four</title><style>body{margin:0;background:#0b0716;color:#fff;font:14px system-ui;text-align:center}#b{display:grid;grid-template-columns:repeat(7,44px);gap:5px;background:#4b36a5;padding:8px;border-radius:12px;width:max-content;margin:16px auto}.c{width:44px;height:44px;border-radius:50%;background:#171126;cursor:pointer}.r{background:#ef4444}.y{background:#facc15}button{padding:8px 12px;border:0;border-radius:8px;background:#6d4cc4;color:#fff;font-weight:700}</style></head><body><h2>⭕ Lolite Connect Four</h2><p id="s">Red's turn</p><div id="b"></div><button onclick="reset()">Restart</button><script>const b=document.getElementById('b'),s=document.getElementById('s');let a=Array.from({length:6},()=>Array(7).fill(0)),t=1,over=0;function draw(){b.innerHTML='';for(let y=0;y<6;y++)for(let x=0;x<7;x++){let d=document.createElement('button');d.className='c '+(a[y][x]===1?'r':a[y][x]===2?'y':'');d.onclick=()=>play(x);b.append(d)}}function win(p){for(let y=0;y<6;y++)for(let x=0;x<7;x++)if([[1,0],[0,1],[1,1],[1,-1]].some(([dx,dy])=>{let n=0;for(let k=0;k<4;k++){let X=x+dx*k,Y=y+dy*k;if(X>=0&&X<7&&Y>=0&&Y<6&&a[Y][X]===p)n++;}return n===4}))return true;return false}function play(x){if(over)return;for(let y=5;y>=0;y--)if(!a[y][x]){a[y][x]=t;if(win(t)){s.textContent=(t===1?'Red':'Yellow')+' wins!';over=1}else if(a.every(r=>r.every(Boolean))){s.textContent='Draw!';over=1}else{t=3-t;s.textContent=(t===1?'Red':'Yellow')+"'s turn"}draw();return}}function reset(){a=Array.from({length:6},()=>Array(7).fill(0));t=1;over=0;s.textContent="Red's turn";draw()}draw()</script></body></html>
