<!doctype html><meta charset=utf-8><title>Lolite 2048</title><style>body{margin:0;background:#090613;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.g{width:min(420px,92vw)}h1{margin:0}.b{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#161126;padding:8px;border-radius:14px;margin-top:15px}.c{aspect-ratio:1;background:#241d38;border-radius:10px;display:grid;place-items:center;font-size:28px;font-weight:800}.n{margin:8px 0;color:#aaa0bd}</style><div class=g><h1>2048</h1><div class=n>Arrow keys / WASD • R to restart</div><div id=b class=b></div></div><script>let a=Array(16).fill(0);function add(){let z=a.map((v,i)=>v?0:i).filter((_,i)=>!a[i]);if(!z.length)return;let i=z[Math.floor(Math.random()*z.length)];a[i]=Math.random()<.9?2:4}function draw(){b.innerHTML=a.map(v=>`<div class=c>${v||''}</div>`).join('')}function move(d){let old=a.join();let rows=[];for(let r=0;r<4;r++){let x=a.slice(r*4,r*4+4);if(d==='l'||d==='r'){if(d==='r')x.reverse();x=x.filter(Boolean);for(let i=0;i<x.length-1;i++)if(x[i]===x[i+1]){x[i]*=2;x.splice(i+1,1)}while(x.length<4)x.push(0);if(d==='r')x.reverse()}rows.push(x)}if(d==='l'||d==='r')a=rows.flat();else{for(let c=0;c<4;c++){let x=[0,1,2,3].map(r=>a[r*4+c]);if(d==='d')x.reverse();x=x.filter(Boolean);for(let i=0;i<x.length-1;i++)if(x[i]===x[i+1]){x[i]*=2;x.splice(i+1,1)}while(x.length<4)x.push(0);if(d==='d')x.reverse();x.forEach((v,r)=>a[r*4+c]=v)}}if(a.join()!==old)add();draw()}add();add();draw();onkeydown=e=>{let k=e.key.toLowerCase();if(k==='r'){a=Array(16).fill(0);add();add();draw()}else if('wasd'.includes(k)||['arrowleft','arrowright','arrowup','arrowdown'].includes(e.key)){e.preventDefault();move(k==='a'||e.key==='ArrowLeft'?'l':k==='d'||e.key==='ArrowRight'?'r':k==='w'||e.key==='ArrowUp'?'u':'d')}}</script>
