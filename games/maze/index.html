<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lolite Maze</title><style>body{margin:0;background:#0b0716;color:#fff;font:14px system-ui;text-align:center}canvas{display:block;margin:12px auto;background:#171126;border:1px solid #6d4cc4;max-width:92vw}button{padding:8px 12px;border:0;border-radius:8px;background:#6d4cc4;color:#fff;font-weight:700}</style></head><body><h2>🌀 Lolite Maze</h2><p>Use arrow keys or WASD. Reach the green square.</p><canvas id="c" width="400" height="400"></canvas><button onclick="make()">New Maze</button><script>const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=20;let m,p=[1,1],goal=[18,18];function make(){m=Array.from({length:N},()=>Array(N).fill(1));let st=[[1,1]];m[1][1]=0;while(st.length){let [y,z]=st[st.length-1],ds=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5),ok=ds.find(([dy,dz])=>{let Y=y+dy,Z=z+dz;return Y>0&&Y<N-1&&Z>0&&Z<N-1&&m[Y][Z]});if(!ok){st.pop();continue}let [dy,dz]=ok;let Y=y+dy,Z=z+dz;m[y+dy/2][z+dz/2]=0;m[Y][Z]=0;st.push([Y,Z])}p=[1,1];draw()}function draw(){x.clearRect(0,0,400,400);for(let y=0;y<N;y++)for(let z=0;z<N;z++){x.fillStyle=m[y][z]?'#4b3b62':'#171126';x.fillRect(z*S,y*S,S-1,S-1)}x.fillStyle='#22c55e';x.fillRect(goal[1]*S+3,goal[0]*S+3,S-7,S-7);x.fillStyle='#22d3ee';x.fillRect(p[1]*S+3,p[0]*S+3,S-7,S-7)}addEventListener('keydown',e=>{let d={ArrowUp:[-1,0],w:[-1,0],ArrowDown:[1,0],s:[1,0],ArrowLeft:[0,-1],a:[0,-1],ArrowRight:[0,1],d:[0,1]}[e.key];if(!d)return;let y=p[0]+d[0],z=p[1]+d[1];if(y>=0&&z>=0&&y<N&&z<N&&!m[y][z]){p=[y,z];draw();if(y===goal[0]&&z===goal[1])setTimeout(()=>alert('You escaped the maze!'),10)}});make()</script></body></html>
