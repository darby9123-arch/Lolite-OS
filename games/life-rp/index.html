function settleRent(){var now=Date.now();if(now-s.lastRent<30000)return;var dt=Math.max(0,Math.min(now-s.lastRent,6*3600000)),total=earnedPerHour()*dt/3600000+s.rentCarry,whole=Math.floor(total);s.rentBank+=whole;s.rentCarry=total-whole;s.lastRent=now;save()}
function xp(amount){s.totalXp+=amount}
function nextPassLevel(){return Math.min(18,Math.floor(s.passXp/650))}
function passReward(t,premium){return t%4===0?{type:"cosmetic",value:(premium?"Gold ":"")+["","City Explorer","Neon Rookie","Homebody","Street Legend","Career Pro","Night Owl","City Builder","Season Star"][Math.floor(t/4)]||"City Star"}:{type:"cash",value:(premium?150:65)+t*(premium?24:10)}}
function rewardLabel(t,premium){var r=passReward(t,premium);return r.type==="cash"?money(r.value):"Badge: "+r.value}
function claimPass(t,premium){if(t<1||t>18||s.passXp<t*650)return note("Earn more season XP to unlock this tier.");if(premium&&!s.premium)return note("Unlock the premium track with game cash first.");var key=premium?"premiumRewards":"freeRewards";if(s[key].includes(t))return;s[key].push(t);var r=passReward(t,premium);if(r.type==="cash"){s.cash+=r.value;log("Season reward",r.value)}else if(!s.cosmetics.includes(r.value))s.cosmetics.push(r.value);save();note("Reward claimed: "+rewardLabel(t,premium));render()}
function propertyCount(){return s.properties.length}
function badge(txt,cls){return '<span class="tag '+(cls||"")+'">'+esc(txt)+'</span>'}
function action(text,act,id,klass,disabled){return '<button type="button" class="btn '+(klass||"")+'" data-action="'+esc(act)+'"'+(id!==undefined?' data-id="'+esc(id)+'"':"")+(disabled?" disabled":"")+">"+text+"</button>"}
function panelIntro(title,desc){return '<div class="section-head"><h2>'+title+'</h2><span>'+desc+'</span></div>'}
function transactionList(){return s.history.length?s.history.slice(0,6).map(function(x){return '<div class="log-item"><span>'+esc(x.label)+' <small>'+esc(x.date)+'</small></span><strong class="'+(x.delta>=0?"money":"")+'">'+(x.delta>=0?"+":"")+money(Math.abs(x.delta))+'</strong></div>'}).join(""):'<p>No transactions yet. Complete your first shift!</p>'}
function navItem(id,emoji,name){return '<button data-action="tab" data-id="'+id+'" class="'+(tab===id?"active":"")+'" aria-current="'+(tab===id?"page":"false")+'"><span class="nav-icon">'+emoji+'</span>'+name+'</button>'}
function layout(body){var subtitle={home:"Your town. Your story.",jobs:"Pick your profession and work interactive shifts.",properties:"Invest your earnings in homes and businesses.",activities:"Discover things to do beyond your day job.",businesses:"Build and run a business with real customer tasks.",quests:"Complete goals to earn cash and season rewards.",shop:"Spend earned cash on games and customisation.",ranks:"Earn promotions by meeting real requirements.",pass:"Earn XP and unlock the season reward tracks.",online:"Meet friends in your private multiplayer room.",profile:"Your resident profile and achievements."};
return '<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div><strong>Lolite Life</strong><small>ROLEPLAY CITY</small></div></div><nav class="nav" aria-label="Life RP sections">'+navItem("home","⌂","Overview")+navItem("jobs","▣","Careers")+navItem("properties","▤","Properties")+navItem("activities","✦","Activities")+navItem("businesses","▤","Businesses")+navItem("quests","✓","Quests")+navItem("shop","◈","Shop")+navItem("ranks","♛","Ranks")+navItem("pass","♛","Battle Pass")+navItem("osquests","◈","OS Quests")+navItem("online","◎","Online Mode")+navItem("profile","◉","My Profile")+'</nav><div class="sidebar-bottom"><strong>'+SEASON+'</strong>All money and rewards are virtual. Offline saves stay here; Online Mode can sync to your account.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">LOLITE LIFE / '+esc(tab.toUpperCase())+'</div><h1>'+({home:"Welcome, "+esc(s.name),jobs:"Career Centre",properties:"Real Estate",activities:"Things To Do",businesses:"My Businesses",quests:"Quests & Missions",shop:"Lolite Shop",ranks:"Career Ranks",pass:"Season Pass",online:"Online Mode",profile:"My Resident"}[tab])+'</h1><p>'+subtitle[tab]+'</p></div><div class="wallet"><div class="pill"><small>Wallet</small><b>'+money(s.cash)+'</b></div><div class="pill"><small>Resident Level</small><b>'+level()+'</b></div><div class="pill"><small>Season Tier</small><b>'+nextPassLevel()+' / 18</b></div></div></header><nav class="lr-shortcuts" aria-label="Quick destinations">'+action("Work","tab","jobs","soft")+action("Minigames","tab","activities","soft")+action("Quest Board","tab","quests","soft")+action("Lolite Quests","tab","osquests","soft")+action("Shop","tab","shop","soft")+action("Pass","tab","pass","soft")+'</nav>'+body+'</main></div>'}
function home(){
var job=currentJob(),progress=(s.totalXp%380)/380*100;
var tasks=milestones.map(function(m){var count=m.field==="properties"?propertyCount():s[m.field],done=count>=m.target,claimed=s.achievements.includes(m.id);return '<div class="task '+(done?"done":"")+'"><div><b class="task-name">'+esc(m.name)+'</b><div class="hint">'+esc(m.desc)+' · '+Math.min(count,m.target)+'/'+m.target+'</div></div><div style="text-align:right"><div class="reward">'+money(m.cash)+' · '+m.xp+' XP</div>'+action(claimed?"Claimed":done?"Claim":"Locked","milestone",m.id,"soft",!done||claimed)+'</div></div>'}).join("");
return '<div class="stack"><section class="panel hero"><div><div class="eyebrow">YOUR LIFE STARTS HERE</div><h2>Make a living.<br>Build something bigger.</h2><p>Choose a career, take on shifts, earn money, buy properties and explore the city at your own pace.</p><div class="selectrow">'+action("Find a job →","tab","jobs","primary")+action("Explore the city","tab","activities","soft")+'</div></div><div class="hero-art" aria-hidden="true">🏙️</div></section><div class="columns"><div class="stack"><section class="panel"><div class="feature-kicker">'+badge("YOUR CURRENT CAREER")+'</div><h2 style="margin-top:10px">'+job.icon+' '+esc(job.name)+'</h2><p>Base pay '+money(job.pay)+' per completed shift. Better decisions mean a stronger paycheck.</p><div class="selectrow">'+action("Work a shift","shift",job.id,"primary")+action("Switch careers","tab","jobs","soft")+'</div></section><section class="panel"><div class="feature-kicker">'+badge("RESIDENT MISSIONS")+'</div>'+tasks+'</section></div><div class="stack"><section class="panel"><h2>Daily Check-In</h2><p>Visit the city each day for a free virtual cash and XP bonus.</p>'+action(s.lastDaily===dailyKey()?"Come back tomorrow":"Claim "+money(150)+" + 90 XP","daily",undefined,"gold full",s.lastDaily===dailyKey())+'</section><section class="panel"><h2>Property Income</h2><p>Your '+propertyCount()+' properties currently earn '+money(earnedPerHour())+' per hour, while time passes.</p><p><strong class="money">'+money(s.rentBank)+'</strong> ready to collect</p>'+action("Collect rental income","rent",undefined,"primary full",s.rentBank<1)+'</section><section class="panel"><h2>Level '+level()+'</h2><div class="progress"><span style="width:'+progress+'%"></span></div><p>'+(s.totalXp%380)+' / 380 XP to the next level</p></section></div></div><section class="panel"><h2>Recent activity</h2><div class="log">'+transactionList()+'</div></section></div>'}
function jobsPage(){var categories=["All"].concat(Array.from(new Set(jobs.map(function(j){return j.field}))));return panelIntro("Pick a career","Change jobs whenever you like.")+'<div class="selectrow" style="margin-bottom:16px">'+categories.map(function(c){return action(esc(c),"filter",c,filter===c?"primary":"soft")}).join("")+'</div><div class="grid">'+jobs.filter(function(j){return filter==="All"||filter===j.field}).map(function(j){var current=j.id===s.job;return '<article class="card"><div class="feature-kicker"><span class="icon-tile">'+j.icon+'</span>'+badge(esc(j.field))+'</div><h3>'+esc(j.name)+'</h3><div class="stats"><span><b>'+money(j.pay)+'</b> base pay</span><span>'+(s.completedJobs[j.id]||0)+' shifts</span></div><p>Complete a two-step roleplay shift to earn your paycheck and season XP.</p><div class="actions">'+(current?badge("YOUR JOB","green"):action("Choose job","choosejob",j.id,"soft"))+action("Work shift","shift",j.id,"primary")+'</div></article>'}).join("")+'</div>'}
function propertiesPage(){return '<section class="panel" style="margin-bottom:15px"><div class="selectrow" style="justify-content:space-between"><div><h2>Property Portfolio</h2><p>'+propertyCount()+' owned · '+money(earnedPerHour())+'/hour rental potential · '+money(s.rentBank)+' uncollected</p></div>'+action("Collect income","rent",undefined,"primary",s.rentBank<1)+'</div><div class="hint">Income builds from elapsed time, up to 6 hours between check-ins. Upgrading boosts a property\'s income by 50%.</div></section>'+panelIntro("Property Market","Buy with money earned in Life RP")+'<div class="grid">'+properties.map(function(p){var own=s.properties.includes(p.id),up=!!s.upgrades[p.id];return '<article class="card"><div class="feature-kicker"><span class="icon-tile">'+p.icon+'</span>'+badge(esc(p.district))+'</div><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><div class="stats"><span>Price <b>'+money(p.price)+'</b></span><span>Income <b>'+money(p.rent*(up?1.5:1))+'/h</b></span></div><div class="actions">'+(!own?action("Buy property","buy",p.id,"primary",s.cash<p.price):(badge("Owned","green")+(s.home===p.id?badge("Active home"):action("Set as home","home",p.id,"soft"))+(!up?action("Upgrade "+money(Math.floor(p.price*.35)),"upgrade",p.id,"gold",s.cash<Math.floor(p.price*.35)):badge("Upgraded","gold"))))+'</div></article>'}).join("")+'</div>'}
function activitiesPage(){return '<section class="panel" style="margin-bottom:15px"><h2>Go Beyond Work</h2><p>Try something new, earn extra cash, collect season XP and build your resident story. Every activity is a short interactive challenge.</p></section>'+panelIntro("Activities & Side Hustles",activities.length+" adventures available")+'<div class="grid">'+activities.map(function(a){return '<article class="card"><div class="feature-kicker"><span class="icon-tile">'+a.icon+'</span>'+badge("SIDE ACTIVITY")+'</div><h3>'+esc(a.name)+'</h3><p>'+esc(a.desc)+'</p><div class="stats"><span><b>'+money(a.pay)+'</b> base reward</span><span><b>'+a.xp+' XP</b></span><span>'+(s.completedActivities[a.id]||0)+' completed</span></div>'+action("Start activity →","activity",a.id,"primary full")+'</article>'}).join("")+'</div>'}
function passPage(){var current=nextPassLevel(),premiumPrice=1800;return '<section class="panel hero" style="min-height:165px;margin-bottom:17px"><div><div class="eyebrow">SEASON 1 / NEW BEGINNINGS</div><h2>Every adventure earns rewards.</h2><p>Work shifts, explore activities and complete missions to build season XP. All tracks are earned with play.</p></div><div class="hero-art" aria-hidden="true">🏆</div></section><div class="columns" style="margin-bottom:20px"><section class="panel"><h2>Season Progress</h2><div class="stats"><b>'+s.passXp.toLocaleString("en-AU")+' season XP</b><span>Tier '+current+' of 18</span></div><div class="progress" style="margin-top:13px"><span style="width:'+Math.min(100,s.passXp/3060*100)+'%"></span></div><p>New reward tier every 170 XP. Your earned tier rewards can be claimed below.</p></section><section class="panel"><h2>Premium Reward Track</h2><p>Unlock a second set of season rewards using virtual cash only. There are no real-money purchases.</p>'+(s.premium?badge("PREMIUM UNLOCKED","gold"):action("Unlock for "+money(premiumPrice),"premium",undefined,"gold full",s.cash<premiumPrice))+'</section></div>'+panelIntro("Reward Road","Free and premium tracks")+'<div class="pass-road">'+Array.from({length:18},function(_,idx){var t=idx+1,unlocked=s.passXp>=t*170,free=s.freeRewards.includes(t),premium=s.premiumRewards.includes(t);return '<article class="tier '+(!unlocked?"locked":"")+'"><div class="feature-kicker">'+badge("TIER "+t,unlocked?"green":"")+'<span class="meta">'+(t*170)+' XP</span></div><div class="pass-slot"><b>Free Reward</b><small>'+esc(rewardLabel(t,false))+'</small>'+action(free?"Claimed":unlocked?"Claim reward":"Locked","claimfree",t,"soft full",free||!unlocked)+'</div><div class="pass-slot premium"><b>Premium Reward</b><small>'+esc(rewardLabel(t,true))+'</small>'+action(premium?"Claimed":!s.premium?"Premium locked":unlocked?"Claim reward":"Tier locked","claimpremium",t,"gold full",premium||!s.premium||!unlocked)+'</div></article>'}).join("")+'</div>'}
function profilePage(){var net=properties.reduce(function(n,p){return n+(s.properties.includes(p.id)?p.price:0)},0);return '<div class="columns"><div class="stack"><section class="panel"><h2>Your identity</h2><div class="selectrow"><div class="avatar chosen">'+s.avatar+'</div><div><b>'+esc(s.name)+'</b><div class="subtle">Level '+level()+' · '+currentJob().name+'</div></div></div><p>Change your display name. Your wallet and purchases will stay on this device.</p><form id="profile-form" class="selectrow"><input class="field" name="residentName" maxlength="24" required aria-label="Resident name" value="'+esc(s.name)+'">'+action("Save name","save-name",undefined,"primary")+'</form><div class="section-head"><h2>Choose an avatar</h2></div><div class="selectrow">'+avatars.map(function(v){return '<button class="avatar '+(v===s.avatar?"chosen":"")+'" aria-label="Avatar '+esc(v)+'" data-action="avatar" data-id="'+esc(v)+'">'+v+'</button>'}).join("")+'</div></section><section class="panel"><h2>Unlocked Badges</h2>'+(s.cosmetics.length?'<div class="selectrow">'+s.cosmetics.map(function(c){return badge(c,"gold")}).join("")+'</div>':'<p>Cosmetic badges are waiting in the season pass.</p>')+'</section></div><div class="stack"><section class="panel"><h2>Resident Stats</h2><div class="log">'+[["Shifts completed",s.shifts],["Side activities",s.activities],["Properties owned",propertyCount()],["Property portfolio",money(net)],["Total XP",s.totalXp.toLocaleString("en-AU")],["Current career",currentJob().name]].map(function(x){return '<div class="log-item"><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>'}).join("")+'</div></section><section class="panel"><h2>Progress Saves Automatically</h2><p>Life RP uses local storage on your current browser or Lolite desktop install. It does not synchronise between devices or require an account.</p>'+action("Export save file","export",undefined,"soft full")+'<p class="hint">You can keep a backup of your Life RP progress. Importing or restoring is not yet supported.</p></section></div></div>'}
function begin(kind,id){var item=byId(kind==="job"?jobs:activities,id);if(!item)return;pending={kind:kind,id:id,step:0,correct:0,order:[]};item.questions.forEach(function(q){var options=[q[1],q[2],q[3]];for(var i=options.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=options[i];options[i]=options[j];options[j]=x}pending.order.push(options)});feedback=null;if(kind==="job")s.job=id;save();render()}
function quiz(){var item=byId(pending.kind==="job"?jobs:activities,pending.id),q=item.questions[pending.step],options=pending.order[pending.step];return '<div class="challenge panel"><div class="ticker">'+(pending.kind==="job"?"WORK SHIFT":"SIDE ACTIVITY")+' · TASK '+(pending.step+1)+' OF '+item.questions.length+'</div><div class="feature-kicker"><span class="icon-tile">'+item.icon+'</span>'+badge(item.name)+'</div><h2 style="margin-top:20px">'+esc(q[0])+'</h2><p>Choose how you want to respond. Correct choices earn a bigger paycheck.</p>'+(feedback?'<div class="feedback '+(!feedback.correct?"bad":"")+'"><b>'+(feedback.correct?"Nice work!":"You can improve next time.")+'</b><p>'+esc(feedback.correct?"Good decision — the team appreciates your work.":"Better approach: "+q[1])+'</p>'+action(pending.step+1===item.questions.length?"Finish and collect reward":"Continue →","next",undefined,"primary")+'</div>':'<div class="answers">'+options.map(function(opt,i){return '<button type="button" class="answer" data-action="answer" data-id="'+i+'">'+esc(opt)+'</button>'}).join("")+'</div>')+action("Leave activity","cancel",undefined,"ghost")+'</div>'}
function finish(){var item=byId(pending.kind==="job"?jobs:activities,pending.id),score=pending.correct,total=item.questions.length,base=pending.kind==="job"?item.pay:item.pay,earn=Math.round(base*(.55+.45*score/total)),gain=(pending.kind==="job"?78:item.xp)+score*12;
s.cash+=earn;xp(gain);
if(pending.kind==="job"){s.shifts++;s.completedJobs[item.id]=(s.completedJobs[item.id]||0)+1}else{s.activities++;s.completedActivities[item.id]=(s.completedActivities[item.id]||0)+1}
log((pending.kind==="job"?"Work: ":"Activity: ")+item.name,earn);var what=pending.kind==="job"?"shift":"activity";pending=null;save();note("Completed "+what+"! +"+money(earn)+" and +"+gain+" XP");tab="home";render()}
function completeMilestone(id){var m=byId(milestones,id);if(!m||s.achievements.includes(id))return;var current=m.field==="properties"?propertyCount():s[m.field];if(current<m.target)return;s.achievements.push(id);s.cash+=m.cash;xp(m.xp);log("Mission: "+m.name,m.cash);save();note("Mission complete! +"+money(m.cash)+" and +"+m.xp+" XP");render()}
function click(actionName,id){
if(window.LoliteLifeRPExpansion?.intercept?.(actionName,id))return;
if(actionName==="tab"){pending=null;tab=id;filter="All";render();return}
if(actionName==="filter"){filter=id;render();return}
if(actionName==="choosejob"){if(!byId(jobs,id))return;s.job=id;save();note("New career selected: "+currentJob().name);render();return}
if(actionName==="shift"){begin("job",id);return}
if(actionName==="activity"){begin("activity",id);return}
if(actionName==="answer"){if(!pending||feedback)return;var item=byId(pending.kind==="job"?jobs:activities,pending.id),opt=pending.order[pending.step][Number(id)];if(opt===undefined)return;var good=opt===item.questions[pending.step][1];if(good)pending.correct++;feedback={correct:good};render();return}
if(actionName==="next"){if(!pending||!feedback)return;var item=byId(pending.kind==="job"?jobs:activities,pending.id);pending.step++;feedback=null;if(pending.step>=item.questions.length)finish();else render();return}
if(actionName==="cancel"){pending=null;feedback=null;render();return}
if(actionName==="daily"){if(s.lastDaily===dailyKey())return;s.lastDaily=dailyKey();s.cash+=150;xp(90);log("Daily check-in",150);save();note("Daily bonus claimed!");render();return}
if(actionName==="milestone"){completeMilestone(id);return}
if(actionName==="buy"){var p=byId(properties,id);if(!p||s.properties.includes(id)||s.cash<p.price)return;s.cash-=p.price;s.properties.push(id);if(!s.home)s.home=id;log("Purchased "+p.name,-p.price);save();note("Congratulations! "+p.name+" is yours.");render();return}
if(actionName==="upgrade"){var up=byId(properties,id);if(!up||!s.properties.includes(id)||s.upgrades[id])return;var cost=Math.floor(up.price*.35);if(s.cash<cost)return;settleRent();s.cash-=cost;s.upgrades[id]=true;log("Upgraded "+up.name,-cost);save();note(up.name+" upgraded! +50% rental income.");render();return}
if(actionName==="home"){if(!s.properties.includes(id))return;s.home=id;save();note("Your new home has been selected.");render();return}
if(actionName==="rent"){settleRent();if(s.rentBank<1)return;var n=s.rentBank;s.cash+=n;s.rentBank=0;log("Property rental income",n);save();note("Collected "+money(n)+" in rental income!");render();return}
if(actionName==="premium"){if(s.premium||s.cash<1800)return;s.cash-=1800;s.premium=true;log("Unlocked premium season",-1800);save();note("Premium reward track unlocked with game cash!");render();return}
if(actionName==="claimfree"||actionName==="claimpremium"){claimPass(Number(id),actionName==="claimpremium");return}
if(actionName==="avatar"){if(!avatars.includes(id))return;s.avatar=id;save();render();return}
if(actionName==="save-name"){var el=document.querySelector('[name=residentName]');if(!el)return;var n=el.value.trim().slice(0,24);if(!n)return note("Please enter a name.");s.name=n;save();note("Resident name updated.");render();return}
if(actionName==="export"){var blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="lolite-life-rp-save.json";a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000);note("Your save file is ready.");return}
}
function onlinePage(){return window.LoliteLifeOnline?.renderPage?.()||'<section class="panel"><h2>Online Mode</h2><p>Connecting to the online module…</p></section>'}
window.LoliteLifeRPBridge=Object.freeze({snapshot:function(){return JSON.parse(JSON.stringify(s))},catalogue:function(){return {jobs:jobs,activities:activities,properties:properties}},replace:function(snapshot){if(!snapshot||typeof snapshot!=="object"||Array.isArray(snapshot))throw Error("Invalid cloud save");localStorage.setItem(KEY,JSON.stringify(snapshot));s=load();pending=null;render();window.LoliteLifeOnline?.onLocalSave?.()},refresh:function(){render()},activeTab:function(){return tab},name:function(){return s.name},job:function(){return currentJob().name}});
function render(){settleRent();var extra=window.LoliteLifeRPExpansion;var challenge=extra?.challengeHTML?.();var custom=extra?.page?.(tab);document.getElementById("app").innerHTML=layout(challenge|| (pending?quiz(): (custom!==null && custom!==undefined?custom:({home:home,jobs:jobsPage,properties:propertiesPage,activities:activitiesPage,pass:passPage,online:onlinePage,profile:profilePage}[tab]||home)())));document.title="Lolite Life RP — "+(challenge?"Challenge":tab[0].toUpperCase()+tab.slice(1));extra?.onRendered?.()}
document.addEventListener("click",function(e){var b=e.target.closest("[data-action]");if(!b||b.disabled)return;var a=b.getAttribute("data-action"),id=b.getAttribute("data-id");click(a,id)});
document.addEventListener("submit",function(e){if(e.target.id==="profile-form"){e.preventDefault();click("save-name")}});window.addEventListener("storage",function(e){if(e.key===KEY){s=load();pending=null;render();window.LoliteLifeOnline?.onLocalSave?.()}});
render();
})();
</script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.js"></script><script defer src="online.js?v=online-2"></script><script defer src="skill-games.js?v=skill-city-3"></script><script defer src="expansion.js?v=skill-city-4"></script></body></html>
