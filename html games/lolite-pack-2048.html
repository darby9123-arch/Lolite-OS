<!doctype html><meta charset="utf-8"><title>Lolite Pack — 2048</title><style>body{margin:0;background:#090613;color:#fff;font:16px system-ui;text-align:center}.grid{width:340px;max-width:90vw;margin:20px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{aspect-ratio:1;background:#1b1630;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:800}.v2{background:#6d4cff}.v4{background:#5a8cff}.v8{background:#e06cff}.v16{background:#ff7b54}.v32{background:#ff4d6d}.v64{background:#22c55e}.v128{background:#06b6d4}.v256{background:#f59e0b}.v512{background:#ec4899}.v1024,.v2048{background:#fff;color:#120d20}</style><h2>🔢 2048</h2><p>Arrow keys / WASD · Join matching tiles</p><div class="grid" id="g"></div><button onclick="reset()">Restart</button><script>let a;function reset(){a=Array(16).fill(0);add();add();draw()}function add(){let z=a.map((v,i)=>v?null:i).filter(i=>i!==null);if(z.length)a[z[Math.floor(Math.random()*z.length)]]=Math.random()<.9?2:4}function move(d){let old=a.join(),rows=[];for(let r=0;r<4;r++){let q=a.slice(r*4,r*4+4);if(d==='L'||d==='R'){if(d==='R')q.reverse();q=q.filter(Boolean);for(let i=0;i<q.length-1;i++)if(q[i]===q[i+1]){q[i]*=2;q.splice(i+1,1)}while(q.length<4)q.push(0);if(d==='R')q.reverse()}rows.push(q)}if(d==='U'||d==='D'){for(let c=0;c<4;c++){let q=[0,1,2,3].map(r=>a[r*4+c]);if(d==='D')q.reverse();q=q.filter(Boolean);for(let i=0;i<q.length-1;i++)if(q[i]===q[i+1]){q[i]*=2;q.splice(i+1,1)}while(q.length<4)q.push(0);if(d==='D')q.reverse();q.forEach((v,r)=>a[r*4+c]=v)}}else rows.flat().forEach((v,i)=>a[i]=v);if(a.join()!==old)add();draw()}function draw(){g.innerHTML=a.map(v=>`<div class="cell v${v}">${v||''}</div>`).join('')}addEventListener('keydown',e=>{const k=e.key.toLowerCase();move(k==='arrowleft'||k==='a'?'L':k==='arrowright'||k==='d'?'R':k==='arrowup'||k==='w'?'U':k==='arrowdown'||k==='s'?'D':null)});const old=move;move=d=>d&&old(d);reset()</script>
