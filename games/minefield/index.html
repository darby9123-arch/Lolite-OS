<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minefield</title><style>body{margin:0;background:#0b0716;color:#eee;font:15px system-ui;text-align:center}.grid{display:grid;grid-template-columns:repeat(10,32px);gap:3px;justify-content:center}.cell{width:32px;height:32px;background:#21163e;border:0;border-radius:5px;color:#fff;font-weight:700}.cell.open{background:#17102e}.new{margin:15px;padding:9px 15px;border:0;border-radius:9px;background:#6d42d8;color:#fff}</style></head><body><h1>Minefield</h1><div id="status"></div><div class="grid" id="grid"></div><button class="new" onclick="start()">New field</button><script>let cells=[],mine=new Set(),done=false;function start(){done=false;cells=Array(100).fill(0);mine=new Set();while(mine.size<15)mine.add(Math.floor(Math.random()*100));render()}function count(i){let x=i%10,y=Math.floor(i/10),n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let nx=x+dx,ny=y+dy;if(nx>=0&&nx<10&&ny>=0&&ny<10&&mine.has(ny*10+nx))n++}return n}function click(i){if(done||cells[i])return;if(mine.has(i)){cells[i]=2;done=true;status.textContent='Boom! New field to try again.';render(true);return}cells[i]=1;status.textContent='Clear! Mines remaining: '+[...mine].filter(m=>!cells[m]).length;render()}function render(show=false){grid.innerHTML=cells.map((v,i)=>`<button class="cell ${v?'open':''}" onclick="click(${i})">${v===2?'💥':v?count(i)||'·':show&&mine.has(i)?'💣':''}</button>`).join('')}start()</script></body></html>
