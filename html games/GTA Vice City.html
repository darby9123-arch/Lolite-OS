<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA Vice City — Lolite Game Store</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080611;color:#f7f3ff;font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}.bar{padding:12px 16px;background:#121022;display:flex;gap:12px;align-items:center;justify-content:space-between;box-sizing:border-box}.muted{color:#aaa0bd;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #30274d;background:#19142d;color:#fff;padding:9px 13px;border-radius:10px;cursor:pointer}button.primary{background:#8b5cf6;border-color:#8b5cf6}.frame{border:0;flex:1;width:100%;background:#000}
</style>
</head>
<body>
<div class="bar"><div><b>GTA Vice City</b><div class="muted">reVCDOS browser port · third-party project</div></div><div class="actions"><button class="primary" id="open">Open full page</button><button id="reload">Reload</button></div></div>
<iframe class="frame" id="game" title="GTA Vice City reVCDOS" src="https://dos.zone/revcdos/" allow="fullscreen; gamepad"></iframe>
<script>
const url='https://dos.zone/revcdos/';
document.getElementById('open').onclick=()=>window.open(url,'_blank','noopener,noreferrer');
document.getElementById('reload').onclick=()=>document.getElementById('game').src=url;
</script>
</body>
</html>
