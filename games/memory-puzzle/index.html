<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Puzzle</title><style>body{margin:0;background:#0b0716;color:#eee;font:15px system-ui;text-align:center}.grid{display:grid;grid-template-columns:repeat(4,70px);gap:8px;justify-content:center}.card{height:70px;border:0;border-radius:12px;background:#21163e;color:#fff;font-size:30px}.card.show{background:#392567}.new{margin:16px;padding:9px 15px;border:0;border-radius:9px;background:#6d42d8;color:#fff}</style></head><body><h1>Memory Puzzle</h1><div id="status">Find all the pairs.</div><div class="grid" id="grid"></div><button class="new" onclick="start()">New game</button><script>const icons=['◆','●','▲','★','♥','■','✦','☀'];let deck,open=[],matched=0;function start(){deck=[...icons,...icons].sort(()=>Math.random()-.5);open=[];matched=0;render()}function pick(i){if(open.length===2||open.includes(i)||document.querySelectorAll('.matched').length&&deck[i]===null)return;open.push(i);render();if(open.length===2){if(deck[open[0]]===deck[open[1]]){matched+=2;setTimeout(()=>{deck[open[0]]=deck[open[1]]=null;open=[];render()},350)}else setTimeout(()=>{open=[];render()},700)}}function render(){grid.innerHTML=deck.map((v,i)=>v===null?'<div></div>':`<button class="card ${open.includes(i)?'show':''}" onclick="pick(${i})">${open.includes(i)?v:'?'}</button>`).join('');status.textContent=matched===16?'You cleared it!':`Pairs found: ${matched/2}/8`}start()</script></body></html>
