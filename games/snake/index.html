<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lolite Snake</title><style>body{margin:0;background:#090613;color:#fff;font:14px system-ui;text-align:center}canvas{max-width:92vw;background:#05040a;border:1px solid #39265f;border-radius:14px}button{margin:10px;padding:9px 15px;border:0;border-radius:10px;background:#8b5cf6;color:white;font-weight:700}</style></head><body><h1>🐍 Lolite Snake</h1><div id=s>Score: 0</div><canvas id=c width=480 height=480></canvas><br><button onclick=start()>New Game</button><p>Arrow keys or WASD</p><script>const x=c.getContext('2d'),n=24,z=20;let q,d,f,sc,t;function start(){q=[[12,12],[11,12],[10,12]];d=[1,0];sc=0;food();clearInterval(t);t=setInterval(loop,95);draw()}function food(){do f=[Math.random()*n|0,Math.random()*n|0];while(q.some(p=>p[0]===f[0]&&p[1]===f[1]))}onkeydown=e=>{let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m&&(m[0]!==-d[0]||m[1]!==-d[1]))d=m};function loop(){let h=[q[0][0]+d[0],q[0][1]+d[1]];if(h[0]<0||h[1]<0||h[0]>=n||h[1]>=n||q.some(p=>p[0]===h[0]&&p[1]===h[1]))return start();q.unshift(h);if(h[0]===f[0]&&h[1]===f[1]){sc++;food()}else q.pop();draw()}function draw(){x.clearRect(0,0,480,480);x.fillStyle='#151022';for(let i=0;i<n;i++)for(let j=0;j<n;j++)x.fillRect(i*z,j*z,z-1,z-1);x.fillStyle='#ec4899';x.fillRect(f[0]*z+2,f[1]*z+2,z-4,z-4);x.fillStyle='#8b5cf6';q.forEach(p=>x.fillRect(p[0]*z+2,p[1]*z+2,z-4,z-4));s.textContent='Score: '+sc}start()</script></body></html>
