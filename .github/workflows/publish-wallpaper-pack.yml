name: Publish original Lolite wallpaper pack
# Use the stable release tag when publishing the final media manifest.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-wallpaper-pack.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: lolite-wallpaper-pack-20261113
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'darby9123-arch/Lolite-OS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: scripts/wallpaper-pack
          persist-credentials: false
      - name: Install media inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Publish original files with verified names, dimensions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wallpaper-pack/publish.py
