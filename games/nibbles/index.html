<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nibbles</title><style>body{margin:0;background:#0b0716;color:#eee;font:15px system-ui;text-align:center}.wrap{display:flex;justify-content:center}.game{background:#07050d;border:1px solid #392567}button{margin:12px;padding:9px 15px;border:0;border-radius:9px;background:#6d42d8;color:#fff}</style></head><body><h1>Nibbles</h1><div id="scoreText">Score: 0</div><div class="wrap"><canvas class="game" id="c" width="400" height="400"></canvas></div><button onclick="start()">New game</button><script>const ctx=c.getContext('2d'),N=20,S=20;let snake,dir,food,score,timer;function start(){snake=[[10,10],[9,10],[8,10]];dir=[1,0];food=[15,10];score=0;clearInterval(timer);timer=setInterval(tick,110);draw();updateScore()}addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){const d=m[e.key];if(d[0]!==-dir[0]||d[1]!==-dir[1])dir=d}});function updateScore(){document.getElementById('scoreText').textContent='Score: '+score}function tick(){let h=[snake[0][0]+dir[0],snake[0][1]+dir[1]];if(h[0]<0||h[0]>=N||h[1]<0||h[1]>=N||snake.some(p=>p[0]===h[0]&&p[1]===h[1])){clearInterval(timer);return}snake.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;updateScore();do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(snake.some(p=>p[0]===food[0]&&p[1]===food[1]))}else snake.pop();draw()}function draw(){ctx.clearRect(0,0,400,400);ctx.fillStyle='#9b78e8';snake.forEach(p=>ctx.fillRect(p[0]*S+1,p[1]*S+1,S-2,S-2));ctx.fillStyle='#d85b9c';ctx.fillRect(food[0]*S+1,food[1]*S+1,S-2,S-2)}start()</script></body></html>
