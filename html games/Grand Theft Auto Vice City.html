<script>
// Avoid blocking the download progress screen with an alert.
const loadingText = document.querySelector("#loading-text");
let loadedBytes = 0;
const TOTAL_ESTIMATED_BYTES = 633.45 * 1024 * 1024;
function updateProgress(name = "", cached = false) {
    const loadedMB = (loadedBytes / (1024 * 1024)).toFixed(2);
    loadingText.textContent = "LOADING... " + loadedMB + " MB / ~633.45 MB";
    const status = document.getElementById("status");
    if (status) status.textContent = (cached ? "Using cached: " : "Downloading: ") + name;
    const progress = document.getElementById("progress");
    if (progress) {
        progress.max = TOTAL_ESTIMATED_BYTES;
        progress.value = Math.min(loadedBytes, TOTAL_ESTIMATED_BYTES);
    }
}
const DB_NAME = "gameFilesDB";
const STORE_NAME = "files";

// Open or create IndexedDB
function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };
        request.onsuccess = e => resolve(e.target.result);
        request.onerror = e => reject(e.target.error);
    });
}

// Save file to IndexedDB
async function saveFile(name, buffer) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.put(buffer, name);
        tx.oncomplete = () => resolve();
        tx.onerror = e => reject(e.target.error);
    });
}

// Get file from IndexedDB
async function getFile(name) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(name);
        request.onsuccess = e => resolve(e.target.result);
        request.onerror = e => reject(e.target.error);
    });
}

// Fetch with progress and caching
async function fetchWithCache(name, url) {
    // Browser storage may be unavailable in private mode or when quota is full.
    let cached = null;
    try { cached = await getFile(name); } catch (error) { console.warn("Vice City cache read failed:", error); }
    if (cached && cached.byteLength) {
        loadedBytes += cached.byteLength;
        updateProgress(name, true);
        return cached;
    }

    const response = await fetch(url);
    if (!response.ok) throw new Error(name + ": download failed (HTTP " + response.status + ").");
    const chunks = [];
    let received = 0;
    if (response.body && typeof response.body.getReader === "function") {
        const reader = response.body.getReader();
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            received += value.byteLength;
            loadedBytes += value.byteLength;
            chunks.push(value);
            updateProgress(name);
        }
    } else {
        const full = new Uint8Array(await response.arrayBuffer());
        chunks.push(full);
        received = full.byteLength;
        loadedBytes += received;
        updateProgress(name);
    }
    if (!received) throw new Error(name + ": downloaded file is empty.");
    const fullBuffer = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.byteLength;
    }
    // Lack of persistent cache must not prevent playing a downloaded game.
    try { await saveFile(name, fullBuffer.buffer); } catch (error) { console.warn("Vice City cache write failed:", error); }
    return fullBuffer.buffer;
}

// Merge multiple parts
async function mergeFiles(fileParts, namePrefix) {
    const buffers = [];
    for (let i = 0; i < fileParts.length; i++) {
        const buffer = await fetchWithCache(`${namePrefix}.part${i+1}`, fileParts[i]);
        buffers.push(buffer);
    }
    const mergedBlob = new Blob(buffers);
    return URL.createObjectURL(mergedBlob);
}

// Generate part URLs
function getParts(file, start, end) {
    let parts = [];
    for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
    }
    return parts;
}

// Check the small, required engine resources before downloading hundreds of MB.
// A missing upstream repository must not cause an expensive, doomed download.
async function verifyRuntimeAvailability() {
    const missing = [];
    for (const name of ["gamepademulator.js", "idbfs.js", "game.js"]) {
        const url = new URL(name, document.baseURI).href;
        let response;
        try {
            response = await fetch(url, { method: "HEAD", cache: "no-store" });
        } catch (error) {
            // HEAD may be blocked by network rules even when classic scripts work.
            // The actual <script> load below remains the authoritative fallback.
            console.warn("Could not preflight Vice City engine script:", name, error);
            continue;
        }
        if ([403, 404, 410].includes(response.status)) {
            missing.push(name + " (HTTP " + response.status + ")");
        }
    }
    if (missing.length) {
        throw new Error("Required engine files are unavailable from this port's external host: " +
            missing.join(", ") + ". The game cannot start until the original host supplies compatible files.");
    }
}

// Start fetching and caching, but only if the engine files are available.
verifyRuntimeAvailability().then(() => Promise.all([
    mergeFiles(getParts("index.data", 1, 7), "index.data"),
    mergeFiles(getParts("audio/emotion.adf", 1, 3), "emotion.adf"),
    mergeFiles(getParts("audio/espant.adf", 1, 3), "espant.adf"),
    mergeFiles(getParts("audio/fever.adf", 1, 3), "fever.adf"),
    mergeFiles(getParts("audio/flash.adf", 1, 3), "flash.adf"),
    mergeFiles(getParts("audio/kchat.adf", 1, 3), "kchat.adf"),
    mergeFiles(getParts("audio/vcpr.adf", 1, 2), "vcpr.adf"),
    mergeFiles(getParts("audio/vrock.adf", 1, 4), "vrock.adf"),
    mergeFiles(getParts("audio/wave.adf", 1, 4), "wave.adf"),
    mergeFiles(getParts("audio/wild.adf", 1, 4), "wild.adf"),
])).then(async ([indexdataurl, EMOTIONadfurl, ESPANTadfurl, FEVERadfurl, FLASHadfurl, KCHATadfurl, VCPRadfurl, VROCKadfurl, WAVEadfurl, WILDadfurl]) => {
    
    // Override fetch to use cached URLs
    const originalFetch = window.fetch;
    window.fetch = async function(input, init) {
        let urlString = input instanceof Request ? input.url : String(input);

        if (urlString.toLowerCase().includes("index.data".toLowerCase())) input = indexdataurl;
        else if (urlString.toLowerCase().includes("emotion.adf".toLowerCase())) input = EMOTIONadfurl;
        else if (urlString.toLowerCase().includes("espant.adf".toLowerCase())) input = ESPANTadfurl;
        else if (urlString.toLowerCase().includes("fever.adf".toLowerCase())) input = FEVERadfurl;
        else if (urlString.toLowerCase().includes("flash.adf".toLowerCase())) input = FLASHadfurl;
        else if (urlString.toLowerCase().includes("kchat.adf".toLowerCase())) input = KCHATadfurl;
        else if (urlString.toLowerCase().includes("VCPR.adf".toLowerCase())) input = VCPRadfurl;
        else if (urlString.toLowerCase().includes("VROCK.adf".toLowerCase())) input = VROCKadfurl;
        else if (urlString.toLowerCase().includes("WAVE.adf".toLowerCase())) input = WAVEadfurl;
        else if (urlString.toLowerCase().includes("WILD.adf".toLowerCase())) input = WILDadfurl;

        return originalFetch(input, init);
    };

    // Similarly override XHR
    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        if (url.includes("https://cdn.dos.zone/vcsky/fetched/".toLowerCase())) url = url.replace("https://cdn.dos.zone/vcsky/fetched/", "")
        if (url.toLowerCase().includes("index.data".toLowerCase())) url = indexdataurl;
        else if (url.toLowerCase().includes("emotion.adf".toLowerCase())) url = EMOTIONadfurl;
        else if (url.toLowerCase().includes("espant.adf".toLowerCase())) url = ESPANTadfurl;
        else if (url.toLowerCase().includes("fever.adf".toLowerCase())) url = FEVERadfurl;
        else if (url.toLowerCase().includes("flash.adf".toLowerCase())) url = FLASHadfurl;
        else if (url.toLowerCase().includes("KCHAT.adf".toLowerCase())) url = KCHATadfurl;
        else if (url.toLowerCase().includes("VCPR.adf".toLowerCase())) url = VCPRadfurl;
        else if (url.toLowerCase().includes("VROCK.adf".toLowerCase())) url = VROCKadfurl;
        else if (url.toLowerCase().includes("WAVE.adf".toLowerCase())) url = WAVEadfurl;
        else if (url.toLowerCase().includes("WILD.adf".toLowerCase())) url = WILDadfurl;
        return originalOpen.call(this, method, url, ...rest);
    };

    // Load game scripts
    // Startup scripts depend on one another: dynamically appended scripts can race.
    for (const src of ["gamepademulator.js", "idbfs.js", "game.js"]) {
        await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.async = false;
            script.src = src;
            script.onload = resolve;
            script.onerror = () => reject(new Error("Could not load " + src));
            document.body.appendChild(script);
        });
    }

    loadingText.remove();
}).catch(error => {
    console.error("Vice City loading failed:", error);
    loadingText.textContent = "Unable to start Vice City.";
    const message = document.createElement("div");
    message.style.cssText = "color:#f1f5ff;text-align:center;font:15px/1.5 system-ui;padding:16px";
    const explanation = document.createElement("p");
    explanation.textContent = error?.message || "Please check your connection and try again.";
    const retry = document.createElement("button");
    retry.type = "button";
    retry.textContent = "Retry loading";
    retry.style.cssText = "padding:10px 18px;border:0;border-radius:7px;background:#6154da;color:#fff;cursor:pointer";
    retry.addEventListener("click", () => location.reload());
    message.append(explanation, retry);
    loadingText.after(message);
});
</script>
