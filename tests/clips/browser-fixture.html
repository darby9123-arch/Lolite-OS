<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lolite Instant Replay browser check</title>
<link rel="stylesheet" href="../../core/clips.css?v=instant-replay-20261124-1">
<link rel="stylesheet" href="../../core/typography.css?v=instant-replay-20261124-1">
<style>
 body{margin:0;padding:18px;background:#0b101b;color:#e9efff;font:14px/1.5 Inter,system-ui,sans-serif}
 header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
 header button{padding:9px 12px;background:#293b57;border:1px solid #637ba5;border-radius:8px;color:inherit;font:inherit;cursor:pointer}
 #source{width:320px;height:90px;display:block;border-radius:8px}#windows{width:min(1020px,100%);margin:auto}
 .window>.content{height:660px;border:1px solid #3f5270;border-radius:12px;overflow:hidden}
 #state{white-space:pre-wrap;font:12px/1.5 monospace;overflow-wrap:anywhere;color:#afc5e8}
 #validation{max-width:1020px;margin:15px auto}#savedPreview{display:block;max-width:100%;width:400px;border-radius:10px}
 #result{color:#b3e7ca}#toast{position:fixed;bottom:15px;left:15px;max-width:480px;padding:8px 12px;background:#273851;border-radius:8px}
</style>
<script>
 // QA only: the production modules run unchanged. No screen, tab, camera or
 // microphone is captured. The source is this generated canvas + synthetic tone.
 const realOpen=indexedDB.open.bind(indexedDB);
 indexedDB.open=(name,version)=>realOpen('replay-fixture-'+name,version);
 let captureCount=0;
 window.page=()=>'';window.openApp=()=>{};
 window.toast=message=>{document.querySelector('#toast').textContent=message};
 Object.defineProperty(navigator.mediaDevices,'getDisplayMedia',{value:async()=>{
  captureCount++;
  const canvas=document.querySelector('#source'),context=canvas.getContext('2d'),started=performance.now();
  const draw=()=>{
   const seconds=(performance.now()-started)/1000;
   context.fillStyle=seconds<10?'#703b78':seconds<30?'#235575':'#386a53';context.fillRect(0,0,640,180);
   context.fillStyle='#fff';context.font='bold 38px system-ui';context.fillText('Replay source · '+seconds.toFixed(1)+'s',20,75);
   context.font='23px system-ui';context.fillText('Generated gameplay test — no screen capture',20,130);
  };
  draw();const timer=setInterval(draw,1000/30),stream=canvas.captureStream(30);
  const audio=new AudioContext(),tone=audio.createOscillator(),gain=audio.createGain(),dest=audio.createMediaStreamDestination();
  tone.frequency.value=440;gain.gain.value=.03;tone.connect(gain);gain.connect(dest);tone.start();await audio.resume();
  stream.addTrack(dest.stream.getAudioTracks()[0]);
  for(const track of stream.getTracks()){
   const stop=track.stop.bind(track);track.stop=()=>{stop();clearInterval(timer);void audio.close().catch(()=>{})};
  }
  return stream;
 }});
 window.addEventListener('DOMContentLoaded',()=>{
  document.querySelector('.content').innerHTML=window.page('clips');
  document.querySelector('#layout').onclick=()=>{
   const windowEl=document.querySelector('#windows');windowEl.style.width=windowEl.style.width==='350px'?'':'350px';
  };
  document.querySelector('#check').onclick=async()=>{
   const output=document.querySelector('#result');output.textContent='Checking saved replay…';
   try{
    const clips=await new Promise((resolve,reject)=>{
     const request=indexedDB.open('lolite-clips-local-v1',1);
     request.onerror=()=>reject(request.error);request.onsuccess=()=>{
      const db=request.result,tx=db.transaction('clips','readonly'),get=tx.objectStore('clips').getAll();
      get.onsuccess=()=>resolve(get.result);get.onerror=()=>reject(get.error);tx.oncomplete=()=>db.close();
     };
    });
    const clip=clips.filter(c=>c.source==='replay').sort((a,b)=>b.createdAt-a.createdAt)[0];
    if(!clip)throw Error('Save a replay first.');
    const player=document.createElement('video');player.id='savedPreview';player.controls=true;player.muted=true;player.playsInline=true;
    const url=URL.createObjectURL(clip.blob);player.src=url;
    document.querySelector('#savedPreview')?.remove();document.querySelector('#validation').appendChild(player);
    await new Promise((resolve,reject)=>{player.onloadedmetadata=resolve;player.onerror=()=>reject(Error('Saved WebM did not load.'));});
    if(!Number.isFinite(player.duration)||player.duration<=0)throw Error('Invalid playback duration.');
    await new Promise((resolve,reject)=>{
     player.onseeked=resolve;player.onerror=()=>reject(Error('Cannot seek saved replay.'));
     player.currentTime=Math.max(.1,player.duration-1);
    });
    await player.play();
    if(player.requestVideoFrameCallback)await new Promise(resolve=>player.requestVideoFrameCallback(resolve));
    player.pause();
    output.textContent='PASS · '+player.duration.toFixed(2)+'s · '+player.videoWidth+'×'+player.videoHeight+
     ' · decoded after seek to '+player.currentTime.toFixed(2)+'s · '+clips.length+' private clips · '+captureCount+' capture request(s)';
   }catch(error){output.textContent='FAIL · '+error.message;}
  };
  setInterval(()=>{document.querySelector('#state').textContent='Capture requests: '+captureCount+'\n'+JSON.stringify(window.LoliteClips.status());},500);
 });
</script>
<script defer src="../../core/clip-replay-buffer.js?v=instant-replay-20261124-1"></script>
<script defer src="../../core/clip-replay.js?v=instant-replay-20261124-1"></script>
<script defer src="../../core/clips.js?v=instant-replay-20261124-1"></script>
</head><body>
<header><strong>Instant replay check · generated footage only</strong><button id="layout">Narrow / wide layout</button><button id="check">Validate newest saved replay</button><canvas id="source" width="640" height="180"></canvas></header>
<div id="windows"><section class="window" data-window-id="clips"><div class="content"></div></section></div>
<div id="validation"><output id="result" role="status"></output><div id="state"></div></div><div id="toast" role="status"></div>
</body></html>
