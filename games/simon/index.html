<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simon</title><style>body{margin:0;background:#0b0716;color:#eee;font:15px system-ui;text-align:center}.pad{display:grid;grid-template-columns:100px 100px;gap:10px;justify-content:center;margin:20px}.p{height:100px;border:0;border-radius:18px;opacity:.65}.p.on{opacity:1;filter:brightness(1.7)}.a{background:#5133a8}.b{background:#2473b8}.c{background:#9a3b8b}.d{background:#4b8d5b}.new{padding:9px 15px;border:0;border-radius:9px;background:#6d42d8;color:#fff}</style></head><body><h1>Simon</h1><div id="status">Press Start</div><div class="pad"><button class="p a" onclick="hit(0)"></button><button class="p b" onclick="hit(1)"></button><button class="p c" onclick="hit(2)"></button><button class="p d" onclick="hit(3)"></button></div><button class="new" onclick="start()">Start</button><script>let seq=[],pos=0,playing=false;const pads=[...document.querySelectorAll('.p')];function flash(i){pads[i].classList.add('on');setTimeout(()=>pads[i].classList.remove('on'),260)}function play(){playing=false;pos=0;let i=0;const t=setInterval(()=>{flash(seq[i++]);if(i>=seq.length){clearInterval(t);playing=true;status.textContent='Your turn'}} ,420)}function start(){seq=[Math.floor(Math.random()*4)];status.textContent='Watch';play()}function hit(i){if(!playing)return;flash(i);if(i!==seq[pos]){playing=false;status.textContent='Wrong! Score: '+(seq.length-1);return}pos++;if(pos===seq.length){seq.push(Math.floor(Math.random()*4));status.textContent='Watch';setTimeout(play,500)}}</script></body></html>
