name: Verify published desktop updater
on:
  push:
    branches: [main]
    paths: ['.github/scripts/verify-desktop-release.cjs', '.github/workflows/verify-desktop-release.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Build and release Lolite Desktop']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install updater runtime dependencies
        run: npm ci --omit=dev --ignore-scripts --prefix desktop
      - name: Exercise the actual published update feed and installer
        run: node .github/scripts/verify-desktop-release.cjs
      - uses: actions/upload-artifact@v5
        with:
          name: live-release-verification
          path: live-release-verification.json
          if-no-files-found: error
