<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Sandbox</title><style>html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;background:#090713;color:#f5f2ff}body{overflow:auto}.wrap{padding:14px;box-sizing:border-box;min-height:100%;background:radial-gradient(circle at 20% 0%,#24134f,#090713 60%)}h1{font-size:24px;margin:0}.sub{color:#a9a0c4;font-size:12px;margin:3px 0 12px}.bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.group{display:flex;gap:5px;flex-wrap:wrap}.btn,select{border:1px solid #3b3157;background:#171128;color:#eee8ff;border-radius:9px;padding:7px 9px;cursor:pointer}.btn.active{background:#5b35a8;border-color:#8f6bd8}.btn:hover{background:#26183d}.danger{background:#32152a}.world{width:100%;max-width:1100px;aspect-ratio:2/1;border-radius:14px;border:1px solid #4a3a6b;background:#08111b;display:block;image-rendering:pixelated;touch-action:none;box-shadow:0 12px 40px #0008}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.stat{background:#120d20;border:1px solid #2f2744;border-radius:9px;padding:6px 9px;font-size:12px}.hint{color:#8f87a5;font-size:11px;margin-top:8px}.slider{accent-color:#8c6ee8;width:110px}</style></head><body><div class="wrap"><h1>🌎 WORLD SANDBOX</h1><div class="sub">A living, high-resolution pixel world — build it, change it, let it evolve.</div><div class="bar"><div class="group" id="tools"></div><button class="btn" id="pause">⏸ Pause</button><button class="btn" id="clear">🧹 Clear</button><button class="btn" id="random">🎲 Random World</button><button class="btn" id="rain">🌧 Rain</button><select id="weather"><option value="clear">☀️ Clear</option><option value="rain">🌧️ Rain</option><option value="storm">⛈️ Storm</option></select><label class="btn">Speed <input id="speed" class="slider" type="range" min="30" max="220" value="80"></label><label class="btn">Brush <input id="brush" class="slider" type="range" min="1" max="6" value="2"></label></div><canvas id="world" class="world" width="240" height="120"></canvas><div class="stats"><span class="stat" id="pop">🧑 People: 0</span><span class="stat" id="trees">🌲 Trees: 0</span><span class="stat" id="villages">🏘 Villages: 0</span><span class="stat" id="water">💧 Water: 0</span><span class="stat" id="lava">🌋 Lava: 0</span><span class="stat" id="tick">⏱ Tick: 0</span><span class="stat" id="wx">☀️ Clear</span></div><div class="hint">Paint with mouse or touch. Water and lava fall/flow, rain fills low areas, people wander, trees spread, and villages grow.</div></div><script>(()=>{const c=document.getElementById('world'),x=c.getContext('2d'),W=240,H=120;const E=0,WATER=1,LAND=2,FOREST=3,DESERT=4,SNOW=5,MOUNTAIN=6,LAVA=7,GRASS=8,PEOPLE=9,VILLAGE=10,ROCK=11;const col=['#08111b','#3188e6','#6f9f4d','#277044','#c79a52','#dcecff','#686078','#ed5b31','#70b85a','#ffd18a','#b88755','#777483'];let g=[],ng=[],tool=LAND,running=true,weather='clear',tick=0,last=0,acc=0,painting=false;const tools=[['water','🌊',WATER],['land','🏝',LAND],['grass','🌱',GRASS],['forest','🌲',FOREST],['desert','🏜',DESERT],['snow','❄',SNOW],['mountain','⛰',MOUNTAIN],['lava','🌋',LAVA],['people','🧑',PEOPLE],['village','🏘',VILLAGE],['rock','🪨',ROCK],['erase','⌫',E]];const T=document.getElementById('tools');tools.forEach(([n,icon,v])=>{const b=document.createElement('button');b.className='btn'+(v===tool?' active':'');b.textContent=icon+' '+n;b.onclick=()=>{tool=v;[...T.children].forEach(q=>q.classList.remove('active'));b.classList.add('active')};T.append(b)});function seed(){g=Array.from({length:H},()=>Array(W).fill(E));for(let yy=H-1;yy>=H-24;yy--)for(let xx=0;xx<W;xx++){const wave=Math.sin(xx*.07)+Math.sin(xx*.021)*2;if(yy>H-10+wave)g[yy][xx]=LAND;else if(yy>H-16+wave)g[yy][xx]=GRASS;else if(yy>H-20+wave&&Math.random()<.35)g[yy][xx]=FOREST}for(let i=0;i<35;i++){const xx=8+Math.random()*(W-16)|0,yy=H-22+Math.random()*16|0;if(g[yy]?.[xx]===GRASS)g[yy][xx]=FOREST}for(let i=0;i<4;i++){const xx=20+Math.random()*(W-40)|0;for(let yy=0;yy<10;yy++)if(Math.random()<.75)g[yy][xx]=SNOW}tick=0}function empty(y,x){return y>=0&&y<H&&x>=0&&x<W&&g[y][x]===E}function movable(v){return v===WATER||v===LAVA||v===PEOPLE}function step(){ng=g.map(r=>r.slice());const move=(y,x,dy,dx)=>{if(y+dy<0||y+dy>=H||x+dx<0||x+dx>=W)return false;if(g[y+dy][x+dx]!==E)return false;ng[y+dy][x+dx]=g[y][x];ng[y][x]=E;return true};for(let y=H-2;y>=0;y--)for(let xx=0;xx<W;xx++){let xx2=xx;if(Math.random()<.5)xx2=W-1-xx;if(g[y][xx2]===WATER){if(move(y,xx2,1,0))continue;const d=Math.random()<.5?-1:1;if(move(y,xx2,0,d)||move(y,xx2,0,-d))continue}else if(g[y][xx2]===LAVA){if(move(y,xx2,1,0))continue;const d=Math.random()<.5?-1:1;if(move(y,xx2,0,d)||move(y,xx2,0,-d))continue}else if(g[y][xx2]===PEOPLE&&Math.random()<.25){const d=Math.random()<.5?-1:1;if(!move(y,xx2,1,0)&&!move(y,xx2,0,d))move(y,xx2,0,-d)}}g=ng;for(let y=1;y<H-1;y++)for(let xx=1;xx<W-1;xx++){if(g[y][xx]===LAVA){for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]])if(g[y+dy][xx+dx]===WATER){g[y][xx]=ROCK;break}}if(g[y][xx]===FOREST&&Math.random()<.006){const dx=Math.random()<.5?-1:1;if(g[y][xx+dx]===GRASS)g[y][xx+dx]=FOREST}if(g[y][xx]===GRASS&&Math.random()<.002&&g[y-1][xx]===E)g[y-1][xx]=FOREST;if(g[y][xx]===PEOPLE&&Math.random()<.008){let found=false;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(g[y+dy]?.[xx+dx]===VILLAGE)found=true;if(!found&&Math.random()<.12)g[y][xx]=VILLAGE}}if(weather!=='clear'&&Math.random()<.22){const n=weather==='storm'?8:3;for(let i=0;i<n;i++){const xx=Math.random()*W|0;for(let y=0;y<H;y++)if(g[y][xx]!==E){if(y>0&&g[y-1][xx]===E)g[y-1][xx]=WATER;break}}}if(weather==='storm'&&Math.random()<.05){for(let i=0;i<5;i++){const yy=Math.random()*H|0,xx=Math.random()*W|0;if(g[yy][xx]===FOREST)g[yy][xx]=GRASS}}tick++}function draw(){x.clearRect(0,0,W,H);const img=x.createImageData(W,H);for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const v=g[y][xx],p=(y*W+xx)*4;let cc=col[v].slice(1);img.data[p]=parseInt(cc.slice(0,2),16);img.data[p+1]=parseInt(cc.slice(2,4),16);img.data[p+2]=parseInt(cc.slice(4,6),16);img.data[p+3]=255}x.putImageData(img,0,0);document.getElementById('pop').textContent='🧑 People: '+count(PEOPLE);document.getElementById('trees').textContent='🌲 Trees: '+count(FOREST);document.getElementById('villages').textContent='🏘 Villages: '+count(VILLAGE);document.getElementById('water').textContent='💧 Water: '+count(WATER);document.getElementById('lava').textContent='🌋 Lava: '+count(LAVA);document.getElementById('tick').textContent='⏱ Tick: '+tick;document.getElementById('wx').textContent=(weather==='clear'?'☀️ Clear':weather==='rain'?'🌧 Rain':'⛈ Storm')}function count(v){let n=0;for(const r of g)for(const q of r)n+=q===v;return n}function paint(ev){const r=c.getBoundingClientRect(),cx=Math.floor((ev.clientX-r.left)/r.width*W),cy=Math.floor((ev.clientY-r.top)/r.height*H),b=+document.getElementById('brush').value;for(let dy=-b+1;dy<b;dy++)for(let dx=-b+1;dx<b;dx++)if(dx*dx+dy*dy<b*b){const yy=cy+dy,xx=cx+dx;if(yy>=0&&yy<H&&xx>=0&&xx<W){if(tool===VILLAGE&&g[yy][xx]===PEOPLE)g[yy][xx]=VILLAGE;else g[yy][xx]=tool}}draw()}c.addEventListener('pointerdown',e=>{painting=true;c.setPointerCapture(e.pointerId);paint(e)});c.addEventListener('pointermove',e=>{if(painting)paint(e)});c.addEventListener('pointerup',()=>painting=false);c.addEventListener('pointercancel',()=>painting=false);document.getElementById('pause').onclick=()=>{running=!running;document.getElementById('pause').textContent=running?'⏸ Pause':'▶ Resume'};document.getElementById('clear').onclick=()=>{g=Array.from({length:H},()=>Array(W).fill(E));draw()};document.getElementById('random').onclick=seed;document.getElementById('rain').onclick=()=>{weather='rain';document.getElementById('weather').value='rain';for(let i=0;i<180;i++){const xx=Math.random()*W|0;for(let y=0;y<H;y++)if(g[y][xx]!==E){if(y>0)g[y-1][xx]=WATER;break}}draw()};document.getElementById('weather').onchange=e=>weather=e.target.value;document.getElementById('speed').oninput=e=>{clearInterval(window.simTimer);window.simTimer=setInterval(()=>{if(running)step();draw()},+e.target.value)};seed();window.simTimer=setInterval(()=>{if(running)step();draw()},80);function frame(t){requestAnimationFrame(frame)}requestAnimationFrame(frame);draw()})();</script></body></html>
