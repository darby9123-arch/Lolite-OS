name: Build and release Lolite Desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'app.js', 'index.html', 'styles.css', 'core/**', 'assets/**', 'games/**', 'html games/**', 'README.md', '.github/scripts/select-desktop-version.cjs', '.github/workflows/desktop-windows.yml']
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', '.github/scripts/select-desktop-version.cjs', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Select a new release version for changed application files
        id: version
        run: node ../.github/scripts/select-desktop-version.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Test actual Windows install, launch, upgrade and uninstall
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lolite-windows
          path: |
            desktop/dist/LoliteOS-Setup.exe
            desktop/dist/lolite-desktop.json
            desktop/dist/SHA512SUMS
            desktop/dist/smoke-*.json
            desktop/dist/smoke-*.png
          if-no-files-found: error
          retention-days: 30
  release:
    needs: windows
    if: needs.windows.outputs.publish == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: lolite-windows
          path: release
      - name: Publish a new version after Windows verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./release/lolite-desktop.json').version")
          TAG="desktop-v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Tag and desktop version do not match.' >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace its verified files." >&2
            exit 1
          fi
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          node -e 'const fs=require("fs");fs.writeFileSync("release/notes.md",fs.readFileSync("desktop/RELEASE-NOTES.md","utf8")+"\n\nBuilt from source commit "+process.env.GITHUB_SHA+".\n")'
          gh release create "$TAG" release/LoliteOS-Setup.exe release/lolite-desktop.json release/SHA512SUMS --target "$GITHUB_SHA" --title "Lolite OS $VERSION for Windows" --notes-file release/notes.md "${FLAGS[@]}"
