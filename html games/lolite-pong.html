<!doctype html><meta charset=utf-8><title>Lolite Pong</title><style>body{margin:0;background:#07050c;color:white;font:14px system-ui;display:grid;place-items:center;min-height:100vh}canvas{width:min(900px,96vw);height:auto;background:#05040a;border:1px solid #30274d;border-radius:16px;image-rendering:pixelated}p{text-align:center;color:#aaa0bd}</style><canvas id=c width=900 height=520></canvas><p>W/S or ↑/↓ • First to 7</p><script>let x=c.getContext('2d'),py=220,ay=220,bx=450,by=260,vx=6,vy=3,score=[0,0];onkeydown=e=>{if(e.key==='w'||e.key==='ArrowUp')py-=35;if(e.key==='s'||e.key==='ArrowDown')py+=35};function loop(){py=Math.max(0,Math.min(440,py));ay+=((by-50)-ay)*.08;bx+=vx;by+=vy;if(by<10||by>510)vy*=-1;if(bx<45&&by>py&&by<py+80){vx=Math.abs(vx);vy+=(by-py-40)*.05}if(bx>855&&by>ay&&by<ay+80)vx=-Math.abs(vx);if(bx<0){score[1]++;reset()}if(bx>900){score[0]++;reset()}x.fillStyle='#05040a';x.fillRect(0,0,900,520);x.strokeStyle='#30274d';x.setLineDash([8,12]);x.beginPath();x.moveTo(450,0);x.lineTo(450,520);x.stroke();x.fillStyle='#8b5cf6';x.fillRect(25,py,20,80);x.fillStyle='#3b82f6';x.fillRect(855,ay,20,80);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,10,0,7);x.fill();x.font='32px system-ui';x.fillText(score[0],410,45);x.fillText(score[1],470,45);requestAnimationFrame(loop)}function reset(){bx=450;by=260;vx=vx>0?-6:6;vy=3}loop()</script>
