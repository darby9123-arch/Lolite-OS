name: Verify Lolite game launchers
on:
  push:
    paths:
      - 'core/game-player.js'
      - 'core/integration.js'
      - 'index.html'
      - 'core/game-store.js'
      - 'core/ugs-catalog.js'
      - 'core/local-game-packages.js'
      - 'tests/ugs-integration.test.cjs'
      - 'core/game-store-gallery.css'
      - 'tests/game-store-gallery.test.cjs'
      - 'tests/game-store-sidebar-art.test.cjs'
      - 'tests/game-store-search.test.cjs'
      - 'core/game-store-ui-cleanup.css'
      - 'tests/game-launches.test.cjs'
      - 'tests/game-server-count.test.cjs'
      - 'tests/raw-html-games.test.cjs'
      - 'tests/repository-html-catalog.test.cjs'
      - 'tests/game-health.test.cjs'
      - 'core/game-health.js'
      - 'html games/**'
      - '.github/workflows/verify-game-launches.yml'
  pull_request:
    paths:
      - 'core/game-player.js'
      - 'core/integration.js'
      - 'index.html'
      - 'core/game-store.js'
      - 'core/ugs-catalog.js'
      - 'core/local-game-packages.js'
      - 'tests/ugs-integration.test.cjs'
      - 'core/game-store-gallery.css'
      - 'tests/game-store-gallery.test.cjs'
      - 'tests/game-store-sidebar-art.test.cjs'
      - 'tests/game-store-search.test.cjs'
      - 'core/game-store-ui-cleanup.css'
      - 'tests/game-launches.test.cjs'
      - 'tests/game-server-count.test.cjs'
      - 'tests/raw-html-games.test.cjs'
      - 'tests/repository-html-catalog.test.cjs'
      - 'tests/game-health.test.cjs'
      - 'core/game-health.js'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game launcher syntax
        run: |
          node --check core/game-player.js
          node --check core/game-health.js
          node --check core/game-store.js
          node --check core/ugs-catalog.js
          node --check core/local-game-packages.js
          node --check core/integration.js
      - name: Test game launching, fallbacks and file paths
        run: node --test tests/game-store-search.test.cjs tests/game-store-ui-cleanup.test.cjs tests/game-store-sidebar-art.test.cjs tests/game-store-gallery.test.cjs tests/game-launches.test.cjs tests/raw-html-games.test.cjs tests/repository-html-catalog.test.cjs tests/game-server-count.test.cjs tests/game-health.test.cjs tests/ugs-integration.test.cjs
